name: Checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check runner toolchain
        run: |
          test "$(uname -m)" = arm64
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$("$DEVELOPER_DIR/usr/bin/xcodebuild" -version | head -n 1)" = "Xcode 26.6"

      - name: Install secret scanner
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
        run: |
          install_root="$RUNNER_TEMP/gitleaks"
          archive="$install_root/gitleaks.tar.gz"
          mkdir -p -m 700 "$install_root"
          curl --fail --location --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$install_root" gitleaks
          chmod 700 "$install_root/gitleaks"
          test "$($install_root/gitleaks version)" = "$GITLEAKS_VERSION"
          printf '%s\n' "$install_root" >> "$GITHUB_PATH"

      - name: Check CI scripts and public files
        run: |
          scripts/run-isolated-tests.sh --self-test
          scripts/verify-public-tree.sh --self-test
          scripts/verify-secrets.sh --self-test
          scripts/verify-public-tree.sh
          scripts/verify-secrets.sh

      - name: Resolve Swift packages
        run: |
          for path in \
            "$RUNNER_TEMP/foodmapper-source-packages" \
            "$RUNNER_TEMP/foodmapper-package-cache" \
            "$RUNNER_TEMP/foodmapper-swiftpm-home" \
            "$RUNNER_TEMP/foodmapper-resolve-tmp"; do
            test ! -L "$path"
            mkdir -p -m 700 "$path"
            chmod 700 "$path"
            test ! -L "$path"
          done
          HOME="$RUNNER_TEMP/foodmapper-swiftpm-home" \
          TMPDIR="$RUNNER_TEMP/foodmapper-resolve-tmp" \
          arch -arm64 "$DEVELOPER_DIR/usr/bin/xcodebuild" -resolvePackageDependencies \
            -project FoodMapper.xcodeproj \
            -scheme FoodMapper \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/foodmapper-source-packages" \
            -packageCachePath "$RUNNER_TEMP/foodmapper-package-cache" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates

      - name: Run isolated ad hoc Debug tests
        env:
          FOODMAPPER_TEST_ARTIFACT_ROOT: /private/tmp
        run: scripts/run-isolated-tests.sh

      - name: Build arm64 Release app without signing
        run: |
          test ! -L "$RUNNER_TEMP/foodmapper-release-tmp"
          test ! -L "$RUNNER_TEMP/foodmapper-release-derived-data"
          mkdir -p -m 700 \
            "$RUNNER_TEMP/foodmapper-release-tmp" \
            "$RUNNER_TEMP/foodmapper-release-derived-data"
          test ! -L "$RUNNER_TEMP/foodmapper-release-tmp"
          test ! -L "$RUNNER_TEMP/foodmapper-release-derived-data"
          chmod 700 \
            "$RUNNER_TEMP/foodmapper-release-tmp" \
            "$RUNNER_TEMP/foodmapper-release-derived-data"
          HOME="$RUNNER_TEMP/foodmapper-swiftpm-home" \
          TMPDIR="$RUNNER_TEMP/foodmapper-release-tmp" \
          arch -arm64 "$DEVELOPER_DIR/usr/bin/xcodebuild" build \
            -project FoodMapper.xcodeproj \
            -scheme FoodMapper \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath "$RUNNER_TEMP/foodmapper-release-derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/foodmapper-source-packages" \
            -packageCachePath "$RUNNER_TEMP/foodmapper-package-cache" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build -- --outDir "$RUNNER_TEMP/foodmapper-site"
          npm audit --audit-level=low

      - name: Check repository state
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
