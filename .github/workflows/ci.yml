name: Checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check runner toolchain
        run: |
          test "$(uname -m)" = arm64
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          case "$("$DEVELOPER_DIR/usr/bin/xcodebuild" -version | head -n 1)" in
            "Xcode 26.6"*) ;;
            *) exit 1 ;;
          esac

      - name: Check CI scripts and public files
        run: |
          scripts/run-isolated-tests.sh --self-test
          scripts/verify-public-tree.sh --self-test
          scripts/verify-public-tree.sh

      - name: Resolve Swift packages
        run: |
          arch -arm64 "$DEVELOPER_DIR/usr/bin/xcodebuild" -resolvePackageDependencies \
            -project FoodMapper.xcodeproj \
            -scheme FoodMapper \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/foodmapper-source-packages"

      - name: Run isolated Debug tests
        run: scripts/run-isolated-tests.sh

      - name: Build arm64 Release app without signing
        run: |
          arch -arm64 "$DEVELOPER_DIR/usr/bin/xcodebuild" build \
            -project FoodMapper.xcodeproj \
            -scheme FoodMapper \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath "$RUNNER_TEMP/foodmapper-release-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build -- --outDir "$RUNNER_TEMP/foodmapper-site"
          npm audit --omit=dev --audit-level=high

      - name: Check repository state
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
